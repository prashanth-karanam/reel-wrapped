[package]
name = "reel-wrapped-engine"
version = "2.4.0"
edition = "2021"
authors = ["Prashanth Karanam <https://github.com/prashanth-karanam>"]
description = "High-performance Rust + WebAssembly Instagram Reel DM telemetry engine and instant UI launcher"
license = "MIT"

[lib]
name = "reel_wrapped_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "reel-wrapped"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
webbrowser = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
