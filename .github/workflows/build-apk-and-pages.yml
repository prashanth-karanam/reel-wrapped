name: Deploy GitHub Pages & Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Build Web + WASM & Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build static bundle
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx vite build
          cp public/spectator-auth.js dist/spectator-auth.js || true
          cp public/manifest.json dist/manifest.json || true
          cp public/sw.js dist/sw.js || true
          cp public/reel_engine.wasm dist/reel_engine.wasm || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Bundle & Capacitor Android APK
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx vite build
          cp public/spectator-auth.js dist/spectator-auth.js || true
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android --no-save
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ReelWrapped-v2.4-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelWrapped-v2.4-Android-APK
          path: ReelWrapped-v2.4-Android.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4-latest
          name: "Reel Wrapped '25 v2.4 (Android APK + Local Engine)"
          body: |
            ### 🎬 Reel Wrapped '25 — v2.4 Release
            - **📲 Android APK**: Download `ReelWrapped-v2.4-Android.apk` below to install directly on Android.
            - **⚡ Windows 1-Line Localhost**:
              ```powershell
              irm https://raw.githubusercontent.com/prashanth-karanam/reel-wrapped/main/install.ps1 | iex
              ```
            - **🍎 macOS / Linux 1-Line Localhost**:
              ```bash
              curl -fsSL https://raw.githubusercontent.com/prashanth-karanam/reel-wrapped/main/install.sh | bash
              ```
          files: ReelWrapped-v2.4-Android.apk
          prerelease: false
